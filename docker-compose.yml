services:
  db:
    image: postgres:18.6
    container_name: sakura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2584"
      POSTGRES_DB: sakura_store
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata: